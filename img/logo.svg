<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Logo Quizz FDD">
  <defs>
    <radialGradient id="peau" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="0.45" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#b8260f"/>
    </radialGradient>
    <linearGradient id="feuille" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6be38f"/>
      <stop offset="1" stop-color="#1f7a3d"/>
    </linearGradient>
    <clipPath id="fruit">
      <path d="M64 30c-10-6-30-4-40 10S14 78 26 94s30 22 38 22 26-6 38-22 12-40 2-54S74 24 64 30z"/>
    </clipPath>
  </defs>

  <!-- badge -->
  <circle cx="64" cy="64" r="62" fill="#120d0b"/>
  <circle cx="64" cy="64" r="57" fill="none" stroke="#ffc23d" stroke-width="3" stroke-dasharray="6 6" opacity="0.55"/>

  <!-- ombre portée -->
  <ellipse cx="66" cy="114" rx="30" ry="5" fill="#000" opacity="0.45"/>

  <!-- fruit -->
  <path d="M64 30c-10-6-30-4-40 10S14 78 26 94s30 22 38 22 26-6 38-22 12-40 2-54S74 24 64 30z" fill="url(#peau)"/>

  <!-- spirales -->
  <g clip-path="url(#fruit)" fill="none" stroke="#5a1406" stroke-width="3.6" stroke-linecap="round" opacity="0.8">
    <path d="M36 52c0-6 8-8 11-3s-2 10-7 8-4-12 4-14 16 4 14 14"/>
    <path d="M80 48c2-6 10-6 12 0s-4 10-8 7-1-11 6-11 13 7 9 16"/>
    <path d="M30 84c0-6 8-8 11-3s-2 10-7 8-4-12 4-14 16 4 14 14"/>
    <path d="M86 86c2-6 10-6 12 0s-4 10-8 7-1-11 6-11 13 7 9 16"/>
    <path d="M58 104c0-5 7-7 9-2s-2 8-6 7-3-10 3-11 13 3 11 11"/>
  </g>

  <!-- reflet -->
  <ellipse cx="44" cy="46" rx="9" ry="5" fill="#fff" opacity="0.35" transform="rotate(-30 44 46)"/>

  <!-- point d'interrogation -->
  <g transform="translate(64 76)">
    <circle r="17" fill="#120d0b" opacity="0.85"/>
    <text y="9" text-anchor="middle" font-family="Audiowide, Arial Black, sans-serif" font-size="26" font-weight="700" fill="#ffc23d">?</text>
  </g>

  <!-- tige en spirale -->
  <path d="M64 31c0-8 2-14 8-16s9 4 5 7-8-1-6-6" fill="none" stroke="#3b2414" stroke-width="5" stroke-linecap="round"/>

  <!-- feuille -->
  <path d="M62 24c-8-12-22-14-30-8 6 10 20 14 30 8z" fill="url(#feuille)"/>
  <path d="M60 23c-8-5-16-7-24-6" fill="none" stroke="#14532a" stroke-width="1.6" stroke-linecap="round"/>
</svg>
